# James configuration. Every key can also be set via environment variables,
# e.g. JAMES_DATA_DIR=/data or JAMES_HTTP__BIND=0.0.0.0:8087.

# Directory for the database, media library, plugins and caches.
data_dir = "data"

[http]
bind = "127.0.0.1:8087"

[log]
# tracing filter syntax, e.g. "info" or "info,james=debug"
level = "info"
# "pretty" or "json"
format = "pretty"

# Plugins run in a Node.js 24+ process (see docs/plugins/README.md).
[plugins]
enabled = true
node = "node"
host = "plugin-host/src/main.ts"
# Plugin directory; default: <data_dir>/plugins
# dir = "plugins"

# Text to speech with Piper (https://github.com/OHF-Voice/piper1-gpl). Voices are
# `<name>.onnx` + `<name>.onnx.json` files in the voices directory, e.g. from
#   python -m piper.download_voices --download-dir data/voices de_DE-thorsten-medium
[tts]
enabled = true
# default_voice = "de_DE-thorsten-medium"
[tts.piper]
# Python with the `piper-tts` package installed
python = "python3"
# relative to data_dir
voices_dir = "voices"
max_workers = 3
idle_timeout_secs = 600

# Single sign-on (OpenID Connect), see docs/sso.md.
# [auth.oidc]
# enabled = true
# issuer = "https://auth.example.com/realms/main"
# client_id = "james"
# client_secret = "…"
# redirect_url = "https://james.example.com/api/v1/auth/oidc/callback"
# display_name = "Keycloak"
# create_users = true
# allowed_groups = ["james-users"]
# default_roles = ["dj"]
# admin_groups = ["james-admins"]
