name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      ts3:
        image: teamspeak:latest
        env:
          TS3SERVER_LICENSE: accept
        ports:
          - 19987:9987/udp
      ts6:
        image: teamspeaksystems/teamspeak6-server:latest
        env:
          TSSERVER_LICENSE_ACCEPTED: accept
        ports:
          - 29987:9987/udp
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Live test against TeamSpeak 3
        run: cargo test --locked -p james-teamspeak --test live -- --test-threads=1
        env:
          JAMES_TS_TEST_ADDR: localhost:19987
      - name: Live test against TeamSpeak 6
        run: cargo test --locked -p james-teamspeak --test live -- --test-threads=1
        env:
          JAMES_TS_TEST_ADDR: localhost:29987

  plugin-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npx tsc -p ../examples/plugins
      # Type-level tests of the plugin API (generic settings, …).
      - run: npx tsc -p ../packages/api/test
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build
