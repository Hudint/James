<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Now playing</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { text-align: center; padding: 16px; max-width: 480px; }
      img { width: 240px; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; }
      h1 { font-size: 1.5rem; margin: 16px 0 4px; }
      p { margin: 0; opacity: 0.7; }
      label { display: block; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Nothing playing</h1>
      <p id="artist"></p>
    </main>
    <!-- Provides James.call / James.connect for the instance the page was opened for. -->
    <script src="/plugins/_/james.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      function show(current) {
        $('title').textContent = current ? current.title : 'Nothing playing';
        $('artist').textContent = current ? [current.artist, current.requestedBy && `requested by ${current.requestedBy}`].filter(Boolean).join(' · ') : '';
      }
      function connect() {
        const socket = James.connect((data) => show(JSON.parse(data).current));
        socket.onclose = () => setTimeout(connect, 5000);
      }
      if (James.ready) {
        James.call('current').then((answer) => show(answer.current));
        connect();
      } else {
        $('title').textContent = 'Open this page from the James web interface.';
      }
    </script>
  </body>
</html>
